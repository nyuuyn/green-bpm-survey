name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data:
    name: Data pipeline (freshness + schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python data/generate_data.py
      - name: Fail if generated/*.json weren't regenerated after a CSV edit
        run: git diff --exit-code -- generated/
      - run: python data/validate_survey.py

  unit:
    name: Unit tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests_e2e/requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest

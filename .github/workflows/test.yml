name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests_e2e/requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest

  # Only runs if both test jobs above succeed, and only on a push to main (not
  # PRs) - a failing test blocks this entirely, so the live site keeps serving
  # its last good deploy instead of a broken one. Requires Pages' source to be
  # set to "GitHub Actions" (Settings -> Pages -> Build and deployment).
  deploy:
    name: Deploy to GitHub Pages
    needs: [unit, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Stage the static site (exclude dev/test tooling)
        run: |
          mkdir _site
          cp index.html survey.html analysis.html style.css common.js survey.js analysis.js data.json _site/
          cp analysis_*.json _site/
          cp -r assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4

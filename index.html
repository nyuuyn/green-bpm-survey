<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green BPM Relevance Survey</title>
<meta name="description" content="Help rate how relevant sustainability guidelines are to Business Process Management.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%8C%B1%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <span class="brand">🌱 Green BPM Survey</span>
    <span id="progressLabel" class="progress-label" hidden></span>
  </header>

  <div id="progressBar" class="progress-bar" hidden><div id="progressFill" class="progress-fill"></div></div>

  <main id="app"></main>

  <footer class="footer">
    <p>
      Responses are anonymous. No account or personal data required.
      Source data and methodology: this survey draws from sustainability guidelines
      published by AWS, Microsoft Azure, Google Cloud, the Green Software Foundation, W3C,
      and academic BPM pattern literature.
    </p>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
